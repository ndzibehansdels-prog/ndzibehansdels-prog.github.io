
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETE-BOOM - Paris Sportifs GABON</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f1419;color:#fff}header{background:#1a2a3a;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{font-size:22px;font-weight:900;color:#00d4ff}.logo span{color:#ffcc00}.balance{background:#00d4ff;color:#000;padding:6px 12px;border-radius:20px;font-weight:700}.tabs{display:flex;gap:8px;padding:10px;background:#1a2a3a;overflow-x:auto}.tab{padding:8px 16px;background:#2a3a4a;border-radius:20px;white-space:nowrap;cursor:pointer;border:none;color:#fff}.tab.active{background:#00d4ff;color:#000}.country-bar{display:flex;gap:8px;padding:10px;background:#121c27;overflow-x:auto}.cbtn{padding:6px 12px;background:#1e2f40;border-radius:15px;font-size:13px;cursor:pointer;border:1px solid #2a4a5a;color:#fff}.cbtn.active{border-color:#00d4ff;background:#00d4ff22}main{padding:10px;padding-bottom:100px}.match{background:#1a2a3a;border-radius:12px;padding:12px;margin-bottom:10px;border-left:4px solid #00d4ff}.match-title{font-weight:700;font-size:15px;display:flex;justify-content:space-between}.league{font-size:11px;color:#8aa0b0;margin:4px 0}.odds{display:flex;gap:8px;margin-top:8px}.odd{flex:1;background:#0f1c27;border:1px solid #2a4a5a;padding:8px;text-align:center;border-radius:8px;cursor:pointer}.odd:hover,.odd.sel{background:#00d4ff;color:#000;border-color:#00d4ff;font-weight:700}.coupon{position:fixed;bottom:0;left:0;right:0;background:#1a2a3a;border-top:2px solid #00d4ff;padding:12px;border-radius:16px 16px 0 0}.c-head{display:flex;justify-content:space-between;font-weight:700}.c-list{max-height:80px;overflow:auto;font-size:13px;margin:6px 0}.c-bet{display:flex;justify-content:space-between;padding:2px 0}.btn-pay{width:100%;background:#ffcc00;color:#000;border:none;padding:14px;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}.btn-pay:disabled{background:#333;color:#666}input{width:100%;padding:10px;border-radius:8px;border:none;background:#0f1c27;color:#fff;margin-top:6px}
</style>
</head>
<body>
<header><div class="logo">BETE-<span>BOOM</span></div><div class="balance">GABON 🇬🇦</div></header>
<div class="tabs">
<button class="tab active" onclick="filterS('all',this)">Tous</button>
<button class="tab" onclick="filterS('football',this)">⚽ Football</button>
<button class="tab" onclick="filterS('basket',this)">🏀 Basket</button>
<button class="tab" onclick="filterS('tennis',this)">🎾 Tennis</button>
<button class="tab" onclick="filterS('rugby',this)">🏉 Rugby</button>
</div>
<div class="country-bar">
<button class="cbtn active" onclick="filterC('all',this)">🌍 Tous</button>
<button class="cbtn" onclick="filterC('gabon',this)">🇬🇦 GABON</button>
<button class="cbtn" onclick="filterC('maroc',this)">🇲🇦 Maroc</button>
<button class="cbtn" onclick="filterC('france',this)">🇫🇷 France</button>
<button class="cbtn" onclick="filterC('espagne',this)">🇪🇸 Espagne</button>
</div>
<main id="matches"></main>
<div class="coupon">
<div class="c-head"><span>Coupon <b id="cnt">0</b></span><span>Cote: <b id="totalC">1.00</b></span></div>
<div class="c-list" id="cList">Clique sur une cote pour parier</div>
<input type="number" id="mise" placeholder="Mise en XAF (ex: 1000)" oninput="calc()">
<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:13px"><span>Mise</span><span>Gain</span></div>
<div style="display:flex;justify-content:space-between;font-weight:700"><span id="miseA">0 XAF</span><span id="gainA" style="color:#ffcc00">0 XAF</span></div>
<button class="btn-pay" id="btnPay" disabled onclick="payer()">PARIER - Airtel / Moov Money</button>
</div>
<script>
const matchs=[
{equipes:"Mangasport vs CF Mounana",ligue:"Gabon - National Foot 1",pays:"gabon",sport:"football",cotes:{1:"1.85",X:"3.20",2:"4.10"}},
{equipes:"Gabon vs Maroc",ligue:"CAN 2025 Qualif",pays:"gabon",sport:"football",cotes:{1:"3.50",X:"3.30",2:"1.95"}},
{equipes:"AS Pélican vs US Bitam",ligue:"Gabon - National Foot 1",pays:"gabon",sport:"football",cotes:{1:"2.10",X:"3.00",2:"3.40"}},
{equipes:"PSG vs Marseille",ligue:"France - Ligue 1",pays:"france",sport:"football",cotes:{1:"1.90",X:"3.60",2:"3.80"}},
{equipes:"Real Madrid vs Barça",ligue:"Espagne - Liga",pays:"espagne",sport:"football",cotes:{1:"2.30",X:"3.50",2:"2.90"}},
{equipes:"Raja vs Wydad",ligue:"Maroc - Botola",pays:"maroc",sport:"football",cotes:{1:"2.40",X:"2.90",2:"3.00"}},
{equipes:"Est Libreville vs Mandji",ligue:"Gabon Basket",pays:"gabon",sport:"basket",cotes:{1:"1.75",2:"2.05"}},
{equipes:"France vs Espagne",ligue:"EuroBasket",pays:"france",sport:"basket",cotes:{1:"1.65",2:"2.25"}},
];
let fS="all",fC="all",coupon=[];
function render(){
const cont=document.getElementById('matches');cont.innerHTML="";
matchs.filter(m=>(fS==="all"||m.sport===fS)&&(fC==="all"||m.pays===fC)).forEach((m,i)=>{
let oddsHtml="";for(let k in m.cotes){oddsHtml+=`<div class="odd" onclick="add('${m.equipes}', '${k}', '${m.cotes[k]}', this)"><div>${k}</div><b>${m.cotes[k]}</b></div>`}
cont.innerHTML+=`<div class="match"><div class="match-title"><span>${m.equipes}</span><span style="font-size:11px">Live</span></div><div class="league">${m.ligue}</div><div class="odds">${oddsHtml}</div></div>`
});
}
function filterS(s,el){fS=s;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function filterC(c,el){fC=c;document.querySelectorAll('.cbtn').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function add(eq,choix,cote,el){el.classList.toggle('sel');const id=eq+"_"+choix;const idx=coupon.findIndex(x=>x.id===id);if(idx>-1){coupon.splice(idx,1)}else{coupon=coupon.filter(x=>!x.id.startsWith(eq+"_"));coupon.push({id,eq,choix,cote:parseFloat(cote)})}update()}
function update(){document.getElementById('cnt').innerText=coupon.length;let tot=1;let html="";coupon.forEach(c=>{tot*=c.cote;html+=`<div class="c-bet"><span>${c.eq} - ${c.choix}</span><span>${c.cote.toFixed(2)}</span></div>`});if(!coupon.length)html="Clique sur une cote pour parier";document.getElementById('cList').innerHTML=html;document.getElementById('totalC').innerText=tot.toFixed(2);document.getElementById('btnPay').disabled=coupon.length===0;calc()}
function calc(){const mise=parseFloat(document.getElementById('mise').value)||0;const cote=parseFloat(document.getElementById('totalC').innerText)||1;document.getElementById('miseA').innerText=mise+" XAF";document.getElementById('gainA').innerText=Math.round(mise*cote)+" XAF"}
function payer(){const mise=document.getElementById('mise').value;if(!mise)return alert("Mets ta mise en XAF");const txt=`BONJOUR BETE-BOOM%0A%0AJe parie:%0A${coupon.map(c=>`- ${c.eq} [${c.choix} @${c.cote}]`).join('%0A')}%0A%0ACote totale: ${document.getElementById('totalC').innerText}%0AMise: ${mise} XAF%0AGain potentiel: ${document.getElementById('gainA').innerText}%0A%0APaiement: Airtel Money / Moov Money`;window.open(`https://wa.me/24100000000?text=${txt}`,'_blank')}
render();
</script>
</body>
</html>
