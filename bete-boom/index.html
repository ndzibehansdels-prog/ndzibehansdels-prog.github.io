<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETE-BOOM GABON - V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f1419;color:#fff}
header{background:#1a2a3a;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.logo{font-size:20px;font-weight:900;color:#00d4ff}.logo span{color:#ffcc00}
.h-left{display:flex;align-items:center;gap:10px}
.menu-btn{font-size:22px;background:none;border:none;color:#fff;cursor:pointer}
.h-right{display:flex;gap:8px;align-items:center}
.btn-sm{padding:6px 12px;border-radius:20px;border:none;font-weight:700;cursor:pointer;font-size:12px}
.btn-login{background:#222e3c;color:#fff;border:1px solid #3a4a5a}
.btn-reg{background:#ffcc00;color:#000}
.tabs{display:flex;gap:8px;padding:10px;background:#1a2a3a;overflow-x:auto}
.tab{padding:8px 16px;background:#2a3a4a;border-radius:20px;white-space:nowrap;cursor:pointer;border:none;color:#fff}
.tab.active{background:#00d4ff;color:#000}
.country-bar{display:flex;gap:8px;padding:10px;background:#121c27;overflow-x:auto}
.cbtn{padding:6px 12px;background:#1e2f40;border-radius:15px;font-size:13px;cursor:pointer;border:1px solid #2a4a5a;color:#fff}
.cbtn.active{border-color:#00d4ff;background:#00d4ff22}
main{padding:10px;padding-bottom:110px}
.match{background:#1a2a3a;border-radius:12px;padding:12px;margin-bottom:10px;border-left:4px solid #00d4ff}
.match-title{font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.league{font-size:11px;color:#8aa0b0;margin:4px 0}
.odds{display:flex;gap:8px;margin-top:8px}
.odd{flex:1;background:#0f1c27;border:1px solid #2a4a5a;padding:8px;text-align:center;border-radius:8px;cursor:pointer}
.odd.sel{background:#00d4ff;color:#000;border-color:#00d4ff;font-weight:700}
.coupon{position:fixed;bottom:0;left:0;right:0;background:#1a2a3a;border-top:2px solid #00d4ff;padding:12px;border-radius:16px 16px 0 0;z-index:15}
.c-head{display:flex;justify-content:space-between;font-weight:700}
.c-list{max-height:80px;overflow:auto;font-size:13px;margin:6px 0}
.btn-pay{width:100%;background:#ffcc00;color:#000;border:none;padding:14px;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}
.btn-pay:disabled{background:#333;color:#666}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #2a4a5a;background:#0f1c27;color:#fff;margin-top:8px}
/* MODALS */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;justify-content:center;align-items:center;padding:20px}
.modal.open{display:flex}
.box{background:#1a2a3a;width:100%;max-width:360px;border-radius:16px;padding:20px;border:1px solid #00d4ff}
.box h2{margin-bottom:12px;text-align:center}
.box button.close{position:absolute;right:15px;top:10px;background:none;border:none;color:#fff;font-size:22px}
.side{display:none;position:fixed;top:0;left:0;bottom:0;width:260px;background:#121c27;z-index:90;padding:20px;border-right:2px solid #00d4ff}
.side.open{display:block}
.side a{display:block;padding:12px 0;color:#fff;text-decoration:none;border-bottom:1px solid #223}
.userTag{font-size:12px;color:#00d4ff;font-weight:700}
</style>
</head>
<body>
<div class="side" id="sideMenu">
<h3 style="color:#00d4ff">MENU</h3>
<a href="#" onclick="openSet()">⚙️ Paramètres</a>
<a href="#" onclick="openLogin()">👤 Connexion / Inscription</a>
<a href="#" onclick="openAbout()">ℹ️ À propos BETE-BOOM</a>
<a href="#" onclick="closeSide()">❌ Fermer</a>
<div style="margin-top:20px;font-size:12px;color:#8aa">Version 2.0 - GABON</div>
</div>

<header>
<div class="h-left"><button class="menu-btn" onclick="openSide()">☰</button><div class="logo">BETE-<span>BOOM</span></div></div>
<div class="h-right">
<div id="userInfo" class="userTag"></div>
<button class="btn-sm btn-login" id="btnLoginH" onclick="openLogin()">Connexion</button>
<button class="btn-sm btn-reg" id="btnRegH" onclick="openReg()">Inscription</button>
</div>
</header>

<div class="tabs">
<button class="tab active" onclick="filterS('all',this)">Tous</button>
<button class="tab" onclick="filterS('football',this)">⚽ Football</button>
<button class="tab" onclick="filterS('basket',this)">🏀 Basket</button>
<button class="tab" onclick="filterS('tennis',this)">🎾 Tennis</button>
</div>
<div class="country-bar">
<button class="cbtn active" onclick="filterC('all',this)">🌍 Tous</button>
<button class="cbtn" onclick="filterC('gabon',this)">🇬🇦 GABON</button>
<button class="cbtn" onclick="filterC('maroc',this)">🇲🇦 Maroc</button>
<button class="cbtn" onclick="filterC('france',this)">🇫🇷 France</button>
</div>
<main id="matches"></main>

<div class="coupon">
<div class="c-head"><span>Coupon <b id="cnt">0</b></span><span>Cote: <b id="totalC">1.00</b></span></div>
<div class="c-list" id="cList">Clique sur une cote pour parier</div>
<input type="number" id="mise" placeholder="Mise en XAF (ex: 1000)" oninput="calc()">
<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:13px"><span id="miseA">0 XAF</span><span id="gainA" style="color:#ffcc00;font-weight:700">Gain: 0 XAF</span></div>
<button class="btn-pay" id="btnPay" disabled onclick="payer()">PARIER - Airtel / Moov Money</button>
</div>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">
<div class="box" style="position:relative">
<button class="close" onclick="closeAll()">×</button>
<h2>Connexion</h2>
<input id="logName" placeholder="Nom d'utilisateur">
<input id="logPass" type="password" placeholder="Mot de passe">
<button class="btn-pay" onclick="doLogin()">Se connecter</button>
<p style="text-align:center;margin-top:10px;font-size:13px">Pas de compte ? <a href="#" onclick="openReg()" style="color:#00d4ff">S'inscrire</a></p>
</div>
</div>

<!-- REG MODAL -->
<div class="modal" id="regModal">
<div class="box" style="position:relative">
<button class="close" onclick="closeAll()">×</button>
<h2>Inscription</h2>
<input id="regName" placeholder="Nom complet">
<input id="regPhone" placeholder="Numéro Airtel / Moov">
<input id="regPass" type="password" placeholder="Créer mot de passe">
<button class="btn-pay" onclick="doReg()">Créer mon compte</button>
</div>
</div>

<!-- SETTINGS -->
<div class="modal" id="setModal">
<div class="box" style="position:relative">
<button class="close" onclick="closeAll()">×</button>
<h2>⚙️ Paramètres</h2>
<p style="font-size:13px;color:#8aa;margin:8px 0">Langue</p><input value="Français - XAF" disabled>
<p style="font-size:13px;color:#8aa;margin:8px 0">Paiement</p><input value="Airtel Money, Moov Money, Airtel" disabled>
<p style="font-size:13px;color:#8aa;margin:8px 0">Notifications cotes GABON</p><button class="btn-sm btn-login" style="width:100%" onclick="alert('Notifications activées !')">Activer</button>
<button class="btn-sm btn-reg" style="width:100%;margin-top:10px" onclick="logout()">Déconnexion</button>
</div>
</div>

<script>
const matchs=[
{equipes:"Mangasport vs CF Mounana",ligue:"Gabon - National Foot 1",pays:"gabon",sport:"football",cotes:{1:"1.85",X:"3.20",2:"4.10"}},
{equipes:"Gabon vs Maroc",ligue:"CAN 2025 Qualif",pays:"gabon",sport:"football",cotes:{1:"3.50",X:"3.30",2:"1.95"}},
{equipes:"AS Pélican vs US Bitam",ligue:"Gabon - National Foot 1",pays:"gabon",sport:"football",cotes:{1:"2.10",X:"3.00",2:"3.40"}},
{equipes:"PSG vs Marseille",ligue:"France - Ligue 1",pays:"france",sport:"football",cotes:{1:"1.90",X:"3.60",2:"3.80"}},
{equipes:"Real Madrid vs Barça",ligue:"Espagne - Liga",pays:"france",sport:"football",cotes:{1:"2.30",X:"3.50",2:"2.90"}},
];
let fS="all",fC="all",coupon=[];
function render(){const cont=document.getElementById('matches');cont.innerHTML="";matchs.filter(m=>(fS==="all"||m.sport===fS)&&(fC==="all"||m.pays===fC)).forEach((m)=>{let o="";for(let k in m.cotes){o+=`<div class="odd" onclick="add('${m.equipes}','${k}','${m.cotes[k]}',this)"><div>${k}</div><b>${m.cotes[k]}</b></div>`}cont.innerHTML+=`<div class="match"><div class="match-title"><span>${m.equipes}</span><span style="font-size:11px">Live</span></div><div class="league">${m.ligue}</div><div class="odds">${o}</div></div>`});}
function filterS(s,el){fS=s;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function filterC(c,el){fC=c;document.querySelectorAll('.cbtn').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function add(eq,choix,cote,el){el.classList.toggle('sel');const id=eq+"_"+choix;const idx=coupon.findIndex(x=>x.id===id);if(idx>-1)coupon.splice(idx,1);else{coupon=coupon.filter(x=>!x.id.startsWith(eq+"_"));coupon.push({id,eq,choix,cote:parseFloat(cote)})}update()}
function update(){document.getElementById('cnt').innerText=coupon.length;let tot=1;let html="";coupon.forEach(c=>{tot*=c.cote;html+=`<div style="display:flex;justify-content:space-between"><span>${c.eq} - ${c.choix}</span><span>${c.cote.toFixed(2)}</span></div>`});if(!coupon.length)html="Clique sur une cote pour parier";document.getElementById('cList').innerHTML=html;document.getElementById('totalC').innerText=tot.toFixed(2);document.getElementById('btnPay').disabled=coupon.length===0;calc()}
function calc(){const mise=parseFloat(document.getElementById('mise').value)||0;const cote=parseFloat(document.getElementById('totalC').innerText)||1;document.getElementById('miseA').innerText=mise+" XAF";document.getElementById('gainA').innerText="Gain: "+Math.round(mise*cote)+" XAF"}
function openSide(){document.getElementById('sideMenu').classList.add('open')}
function closeSide(){document.getElementById('sideMenu').classList.remove('open')}
function openLogin(){closeSide();document.getElementById('loginModal').classList.add('open')}
function openReg(){closeAll();document.getElementById('regModal').classList.add('open')}
function openSet(){closeSide();document.getElementById('setModal').classList.add('open')}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))}
function openAbout(){alert('BETE-BOOM GABON - Paris sportifs 100% Gabonais. Paiement Airtel Money / Moov Money. Contact WhatsApp: +241 00 00 00 00');}
function doReg(){const n=document.getElementById('regName').value;if(!n)return alert('Mets ton nom');localStorage.setItem('beteboom_user',n);document.getElementById('userInfo').innerText="👤 "+n;document.getElementById('btnLoginH').style.display='none';document.getElementById('btnRegH').style.display='none';closeAll();alert('Compte créé ! Bienvenue '+n)}
function doLogin(){const n=document.getElementById('logName').value;if(!n)return alert('Mets ton nom');localStorage.setItem('beteboom_user',n);document.getElementById('userInfo').innerText="👤 "+n;document.getElementById('btnLoginH').style.display='none';document.getElementById('btnRegH').style.display='none';closeAll()}
function logout(){localStorage.removeItem('beteboom_user');location.reload()}
function payer(){let u=localStorage.getItem('beteboom_user');if(!u){openLogin();return alert('Connecte-toi d\'abord !')}const mise=document.getElementById('mise').value;if(!mise)return alert("Mets ta mise");const txt=`BONJOUR BETE-BOOM%0AClient: ${u}%0A%0AJe parie:%0A${coupon.map(c=>`- ${c.eq} [${c.choix} @${c.cote}]`).join('%0A')}%0A%0ACote: ${document.getElementById('totalC').innerText}%0AMise: ${mise} XAF%0AGain: ${document.getElementById('gainA').innerText}%0A%0APaiement: Airtel/ Moov`;window.open(`https://wa.me/24100000000?text=${txt}`,'_blank')}
(function(){let u=localStorage.getItem('beteboom_user');if(u){document.getElementById('userInfo').innerText="👤 "+u;document.getElementById('btnLoginH').style.display='none';document.getElementById('btnRegH').style.display='none'}})();
render();
</script>
</body>
</html>
